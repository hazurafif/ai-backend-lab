# fly.toml — generated for the AI Backend app.
# NOTE: "app" must be globally unique on Fly.io; change it if "aibackend" is taken
# (or run `fly launch --no-deploy` to auto-pick a name).

app = "aibackend"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.checks]
    [http_service.checks.health]
      interval = "10s"
      timeout = "3s"
      grace_period = "30s"
      method = "GET"
      path = "/health"
      protocol = "http"
