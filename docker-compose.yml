services:
  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      # In-compose the app reaches Postgres via the service name.
      DATABASE_URI: postgresql://aibackend:aibackend@postgres:5432/aibackend
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aibackend
      POSTGRES_PASSWORD: aibackend
      POSTGRES_DB: aibackend
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aibackend"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Self-hosted metasearch engine backing the agent's web_search tool.
  # JSON API is enabled via ./searxng/settings.yml (required by the backend).
  searxng:
    image: searxng/searxng:latest
    ports:
      - "8080:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped

  # Vector store for the knowledge base (RAG): hybrid search, no vectorizer
  # modules — embeddings are computed in app code (WEAVIATE_URL in .env).
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.30.0
    environment:
      QUERY_DEFAULTS_LIMIT: "25"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: "none"
      CLUSTER_HOSTNAME: node1
    ports:
      - "8081:8080"
    volumes:
      - weaviate_data:/var/lib/weaviate
    restart: unless-stopped

volumes:
  pgdata:
  weaviate_data:
