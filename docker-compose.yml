services:
  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      # In-compose the app reaches Postgres via the service name.
      DATABASE_URI: postgresql://aibackend:aibackend@postgres:5432/aibackend
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aibackend
      POSTGRES_PASSWORD: aibackend
      POSTGRES_DB: aibackend
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aibackend"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Self-hosted metasearch engine backing the agent's web_search tool.
  # JSON API is enabled via ./searxng/settings.yml (required by the backend).
  searxng:
    image: searxng/searxng:latest
    ports:
      - "8080:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped

volumes:
  pgdata:
