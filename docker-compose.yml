# AI backend stack: FastAPI Deep Agents app + Postgres.
#
#   docker compose up -d --build          # app (:8000) + Postgres (:5432)
#   docker compose --profile extras up -d # + searxng (:8092) + weaviate (:8093)
#   docker compose logs -f app            # follow the app logs
#
# `name` pins the compose project so containers/volumes keep their current
# names (ai-backend-lab-*) across config changes.
name: ai-backend-lab

services:
  app:
    build: .
    # Run as root INSIDE the container. Reason: OrbStack bind mounts present
    # host files as root-owned (named volumes get auto-chowned to the
    # container user, bind mounts don't), so the image's non-root appuser
    # could not own the workspace -> git "dubious ownership" + EPERM on
    # .git-credentials. As root, everything written maps to the host user
    # (root-in-OrbStack == macOS user), so .workspace stays browsable on the
    # host. The container is still the boundary — not the host.
    user: "0"
    env_file:
      - path: .env
        required: false
    environment:
      # In-compose the app reaches Postgres via the service name.
      DATABASE_URI: postgresql://aibackend:aibackend@postgres:5432/aibackend
      # Self-hosted SearXNG (extras profile) via the compose network; for a
      # host-side dev run (uv run uvicorn) use SEARXNG_URL=http://localhost:8092.
      SEARXNG_URL: http://searxng:8080
    ports:
      - "8000:8000"
    volumes:
      # Per-user agent workspaces (one real dir per user) are a BIND MOUNT of
      # the host's ./.workspace — so .workspace/<username>/ shows up on the
      # host right after user creation, and the workspace git repo (versioning
      # only) lives in the same dir. The dir is gitignored in the app repo.
      # Note: the container runs as uid 10001, so the host dir must be
      # writable by that uid (chmod -R a+w .workspace if create fails).
      - ./.workspace:/app/.workspace
    depends_on:
      postgres:
        condition: service_healthy
    # The agent's execute tool runs inside this container (cwd /app, as
    # appuser) — the container is the boundary, not the host.
    # MCP servers running on the host (e.g. gofastmcp on :8090) must be
    # configured in /agent/tools with `host.containers.internal` as the host:
    # `127.0.0.1` inside this container is the container itself and is refused.
    mem_limit: 1g
    pids_limit: 512
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aibackend
      POSTGRES_PASSWORD: aibackend
      POSTGRES_DB: aibackend
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aibackend"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Self-hosted metasearch engine backing the agent's web_search tool.
  # JSON API is enabled via ./searxng/settings.yml (required by the backend).
  # Opt-in: docker compose --profile extras up -d searxng
  searxng:
    image: searxng/searxng:latest
    profiles: ["extras"]
    ports:
      - "8092:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped

  # Vector store for the knowledge base (RAG): hybrid search, no vectorizer
  # modules — embeddings are computed in app code (WEAVIATE_URL in .env).
  # Opt-in: docker compose --profile extras up -d weaviate
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.30.0
    profiles: ["extras"]
    environment:
      QUERY_DEFAULTS_LIMIT: "25"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: "none"
      CLUSTER_HOSTNAME: node1
    ports:
      - "8093:8080"
    volumes:
      - weaviate_data:/var/lib/weaviate
    restart: unless-stopped

volumes:
  pgdata:
  weaviate_data:
