# AI backend stack: FastAPI Deep Agents app + Postgres.
#
#   podman compose up -d --build          # app (:8000) + Postgres (:5432)
#   podman compose --profile extras up -d # + searxng (:8092) + weaviate (:8093)
#   podman compose logs -f app            # follow the app logs
#
# `name` pins the compose project so containers/volumes keep their current
# names (ai-backend-lab-*) across config changes.
name: ai-backend-lab

services:
  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      # In-compose the app reaches Postgres via the service name.
      DATABASE_URI: postgresql://aibackend:aibackend@postgres:5432/aibackend
    ports:
      - "8000:8000"
    volumes:
      # Host copies of uploads + agent workspace files (non-routed writes).
      # Store-backed routes (/skills/, /memories/, /tmp/, /uploads/) live in
      # Postgres and need no volume.
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    # The agent's execute tool runs inside this container (cwd /app, as
    # appuser) — the container is the boundary, not the host.
    # MCP servers running on the host (e.g. gofastmcp on :8090) must be
    # configured in /agent/tools with `host.containers.internal` as the host:
    # `127.0.0.1` inside this container is the container itself and is refused.
    mem_limit: 1g
    pids_limit: 512
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aibackend
      POSTGRES_PASSWORD: aibackend
      POSTGRES_DB: aibackend
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aibackend"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Self-hosted metasearch engine backing the agent's web_search tool.
  # JSON API is enabled via ./searxng/settings.yml (required by the backend).
  # Opt-in: podman compose --profile extras up -d searxng
  searxng:
    image: searxng/searxng:latest
    profiles: ["extras"]
    ports:
      - "8092:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped

  # Vector store for the knowledge base (RAG): hybrid search, no vectorizer
  # modules — embeddings are computed in app code (WEAVIATE_URL in .env).
  # Opt-in: podman compose --profile extras up -d weaviate
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.30.0
    profiles: ["extras"]
    environment:
      QUERY_DEFAULTS_LIMIT: "25"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: "none"
      CLUSTER_HOSTNAME: node1
    ports:
      - "8093:8080"
    volumes:
      - weaviate_data:/var/lib/weaviate
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  weaviate_data:
