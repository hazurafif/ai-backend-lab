[project]
name = "app"
version = "0.1.0"
description = "AI backend: Deep Agents harness + Postgres persistence + MCP (gofastmcp) tools, streaming API for a future frontend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.12",
    "uvicorn[standard]>=0.34.3",
    "bcrypt>=4.2.1",
    "pyjwt>=2.9.0",
    "python-dotenv>=1.0.1",
    # Agent
    "deepagents>=0.7.5",
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=0.3.0",
    # Persistence (Postgres)
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary]>=3.2.0",
    # MCP (gofastmcp servers, streamable HTTP / stdio)
    "langchain-mcp-adapters>=0.3.2",
    "mcp>=1.9.0",
    # Web search (SearXNG client)
    "httpx>=0.28.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
    "pre-commit>=4.0.0",
]

[tool.uv]
# src layout: package lives in src/app, installed editable by `uv sync`
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["E501"]  # long strings/URLs; formatter handles line wrapping

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert is fine in tests
"scripts/*" = ["S101"]

[tool.ruff.lint.flake8-bugbear]
# Depends() in argument defaults is the idiomatic FastAPI pattern.
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
